name: nightly-backup

# v0.1.4 C1: Supabase Free には自動バックアップが無いため、自前で
# pg_dump → gzip → age 暗号化 → Cloudflare R2 (S3 互換 API) へ PUT する。
# Supabase Pro の日次スナップショット(7日保持)を超える長期保険、および
# Supabase 自体が飛んだ場合(アカウント BAN・課金トラブル等)の唯一の保険。
# 当時の設計記録(いずれも archive 済み):
#   docs/local/archive/v0.2.0/pending_backup-and-data-portability.md 層2
#   docs/local/archive/v0.1.4/task_v0.1.4-c1-backup-layer2.md
#
# 復号鍵(age 秘密鍵)は本 workflow のどこにも存在しない。作者ローカルの
# secure store で保管する。復元手順の現行正本は次の 2 本:
#   ローカル復元試験: docs/local/manual_backup-restore-runbook.md
#   本番復元(緊急時): docs/local/manual_production-restore-runbook.md
#
# 重要(2026-09-18 C8): 下の pg_dump は --no-acl なので GRANT / REVOKE は dump に入らない。
# 復元しただけでは列単位の権限層が戻らない(RLS の検査は全部通るので気づけない)。
# 復元先では migration の再適用が必須。手順は manual_production-restore-runbook.md の
# 「Step 5-2」「Step 5-3」を参照。
#
# 接続情報は URL 一本ではなく個別 Secret + PGPASSWORD 方式。理由:
# libpq の URL parse エラー時にパスワード断片がエラー log に漏れる過去事例あり
# (2026-07-06 セッションで実際に発生)。個別値方式なら URL parse が発生せず
# 認証失敗時のエラーも "password authentication failed" のみで断片漏洩なし。

on:
  schedule:
    # 03:00 JST = 18:00 UTC(前日)
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump -> encrypt -> R2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify required secrets are configured
        run: |
          missing=""
          for name in SUPABASE_DB_HOST SUPABASE_DB_PORT SUPABASE_DB_USER SUPABASE_DB_NAME SUPABASE_DB_PASSWORD BACKUP_AGE_PUBLIC_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            value="${!name}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Install pg_dump (PostgreSQL 17) and age
        run: |
          # Supabase は PostgreSQL 17 系。Ubuntu 24.04 標準の postgresql-client は 16 系で
          # meta-version 不一致のため pg_dump が失敗する。PostgreSQL 公式 apt repo から 17 を入れる。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release age
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version
          # aws-cli v2 は ubuntu-latest ランナーにプリインストール済み

      # 2026-09-18 C13: 本番側の「Enforce SSL on incoming connections」は OFF で、
      # プーラーは平文セッションを拒否しない。libpq 既定の transport mode(prefer)は
      # サーバーの身元も検証しないため、経路上に立てる相手がいると平文へ落とせる。
      # dump 側を sslmode=verify-full に固定し、相手を確かめる。
      #
      # 2026-09-18: verify-full + PGSSLROOTCERT=system(OS の信頼ストア)を実地で試したが
      # `SSL error: certificate verify failed` で通らなかった(run 35351036279)。
      # 接続先は一般に信頼された証明書ではなく Supabase 自身の CA で署名された証明書を出す。
      #
      # いまは require にしてある。**これは平文への降格を塞ぐ設定で、暗号化は必須。**
      # 塞げていないのは「相手が本当に Supabase か」の確認だけ。
      # 突くには経路乗っ取りか DNS 乗っ取りが要る狙い撃ちの攻撃になる。
      #
      # verify-full へ上げるには Supabase の CA 証明書が要る(公開情報・秘密ではない)。
      # 取得して repo へ commit し、PGSSLROOTCERT をそのファイルへ向ければ
      # Secret 管理なしで verify-full にできる。判断は docs/local/plan_security-audit-remediation.md の
      # 「C13 の方針変更」を参照。
      #
      # **prefer や disable へは戻さないこと。** 既定の prefer はサーバーが拒めば平文に落ちる。
      - name: pg_dump (custom format, no owner/acl, verify-full TLS)
        env:
          # PGPASSWORD 経由でパスワードを渡す。URL 形式を使わないので
          # parse エラー由来の password 断片漏れが発生しない。
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          # require = 暗号化を必須にする。サーバーが平文を求めても接続しない。
          # 相手の身元(証明書の署名とホスト名)は確認しない。上のコメントを読むこと。
          PGSSLMODE: require
        run: |
          set +e
          pg_dump \
            -h "$SUPABASE_DB_HOST" \
            -p "$SUPABASE_DB_PORT" \
            -U "$SUPABASE_DB_USER" \
            -d "$SUPABASE_DB_NAME" \
            --format=custom --no-owner --no-acl \
            -f backup.dump
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::pg_dump が失敗しました。TLS が原因の場合の切り分け:"
            echo "::error::'server does not support SSL' = 接続先が暗号化に対応していない。"
            echo "::error::SUPABASE_DB_HOST が直結かプーラーかを確認する。"
            echo "::error::**PGSSLMODE を prefer / disable へ下げて平文を許す形へは戻さないこと。**"
            exit "$status"
          fi

      - name: gzip
        run: gzip backup.dump

      - name: Encrypt with age (public key only; secret key never touches CI)
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          age -r "$BACKUP_AGE_PUBLIC_KEY" -o backup.dump.gz.age backup.dump.gz
          rm -f backup.dump.gz

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            s3 cp backup.dump.gz.age "s3://${R2_BUCKET}/nightly/${DATE}.dump.gz.age"

      - name: Rotate backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          CUTOFF="$(date -u -d '30 days ago' +%Y-%m-%dT00:00:00.000Z)"
          KEYS="$(aws --endpoint-url "$ENDPOINT" s3api list-objects-v2 \
            --bucket "$R2_BUCKET" --prefix "nightly/" \
            --query "Contents[?LastModified<=\`${CUTOFF}\`].Key" \
            --output text)"
          if [ -z "$KEYS" ] || [ "$KEYS" = "None" ]; then
            echo "No objects older than 30 days."
            exit 0
          fi
          echo "$KEYS" | tr '\t' '\n' | while IFS= read -r key; do
            [ -n "$key" ] || continue
            echo "Deleting s3://${R2_BUCKET}/${key}"
            aws --endpoint-url "$ENDPOINT" s3 rm "s3://${R2_BUCKET}/${key}"
          done
