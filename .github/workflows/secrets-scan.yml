name: secrets-scan

# Layer 3 of the secrets-scan defense: server-side backstop if the local hook was bypassed or absent.
# Runs only the exact public doxguard 0.2.0 package (strict mode) through
# scripts/secrets-scan.dual.mjs --native-only. The legacy scanner is no longer run in CI.
# A missing or failing native package fails closed.
#
# Note: the CI runner does NOT have access to the private watchlist, so only the structural
# patterns (Windows/POSIX absolute paths, RFC1918 private IPs, emails) run on this side.
# Layer 2 catches watchlist leaks locally; layer 4 (release skill) runs on the release machine.

on:
  push:
    branches:
      - main
      - develop
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  scan:
    name: scan tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Resolve exact public scanner package
        continue-on-error: true
        run: |
          if ! npm install --prefix "$RUNNER_TEMP/doxguard-ci" --ignore-scripts --include=optional --package-lock=false --no-save doxguard@0.2.0 > "$RUNNER_TEMP/doxguard-install.log" 2>&1; then
            echo 'Exact doxguard 0.2.0 package unavailable; dual gate will fail closed.'
            exit 1
          fi

      - name: Test strict native positive and negative controls
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOXGUARD_PACKAGE_ROOT: ${{ runner.temp }}/doxguard-ci/node_modules/doxguard
        run: node scripts/secrets-scan.dual.mjs --native-only --controls

      - name: Test safe dual-scanner reporting
        if: ${{ !cancelled() }}
        run: node --test scripts/secrets-scan.dual.test.mjs scripts/secrets-scan.staged.test.mjs

      - name: Run strict public scan (doxguard only)
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOXGUARD_PACKAGE_ROOT: ${{ runner.temp }}/doxguard-ci/node_modules/doxguard
        run: node scripts/secrets-scan.dual.mjs --native-only --all-tracked

      # 履歴走査（--history）は、この repo では行わない（2026-10-20 決定）。
      # 履歴の古い blob 5 件に private path の例が残っており、履歴は書き換えない方針のため。
      # 履歴のパスワード・API キーは gitleaks（fetch-depth: 0）が引き続き検査する。
