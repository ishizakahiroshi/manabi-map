name: Validate web

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  HAS_SUPABASE_BUILD_ACCESS: ${{ secrets.SUPABASE_ANON_KEY != '' }}

concurrency:
  group: validate-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Generate public school data
        if: env.HAS_SUPABASE_BUILD_ACCESS == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # schools 系は anon で SELECT 可能（RLS: "Public read schools"）。個人データは
          # RLS（auth.uid() = user_id）で保護されるため、公開データ生成は公開値の anon key
          # で十分。service role のような全権限鍵は CI に載せない（DEP-CI-01）。
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm gen:schools-json

      - name: Build app
        if: env.HAS_SUPABASE_BUILD_ACCESS == 'true'
        env:
          # Build-time placeholders only. Production receives its real public
          # values from Cloudflare Pages; no service credential reaches Vite.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-placeholder
          VERSION_OVERRIDE: ci-${{ github.sha }}
        run: pnpm exec vite build

      - name: Build SSR bundle
        if: env.HAS_SUPABASE_BUILD_ACCESS == 'true'
        run: pnpm build:ssr

      - name: Generate SEO pages
        if: env.HAS_SUPABASE_BUILD_ACCESS == 'true'
        run: pnpm exec tsx scripts/gen-seo-pages.mjs

      - name: Verify static output, SEO, gzip, and 25 MiB limit
        if: env.HAS_SUPABASE_BUILD_ACCESS == 'true'
        run: pnpm verify:static
