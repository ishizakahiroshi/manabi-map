name: Validate web

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: validate-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check CLAUDE.md structure
        working-directory: .
        run: node scripts/check-claude-md.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Compare the PR head with its common ancestor, not the synthetic merge
      # checkout. Push events use the previous tip. No DB/secrets are accessed.
      - name: Check grants in added migrations
        working-directory: .
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-migration-grants.mjs --base "$MIGRATION_BASE_SHA" --head "$MIGRATION_HEAD_SHA"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Always exercise the generator and Vite/SSR/SEO using invented data.
      # No school DB, auth secret, or observed capture is needed in ordinary CI.
      # Production data capacity and real account/UI acceptance stay separate.
      - name: Prepare offline synthetic SQLite snapshot
        run: |
          mkdir "$RUNNER_TEMP/school-ci"
          python -B ../scripts/local-data/prepare_school_ci.py --output "$RUNNER_TEMP/school-ci/input.json"
          python -B ../scripts/local-data/store_school.py import --input "$RUNNER_TEMP/school-ci/input.json" --db "$RUNNER_TEMP/school-ci/source.sqlite" --apply
          python -B ../scripts/local-data/store_school.py export --db "$RUNNER_TEMP/school-ci/source.sqlite" --output "$RUNNER_TEMP/school-ci/bundle"

      - name: Build and verify synthetic app, SSR, SEO, and static output
        run: |
          node scripts/build-school-candidates.mjs --snapshot="$RUNNER_TEMP/school-ci/bundle/snapshot.json" --manifest="$RUNNER_TEMP/school-ci/bundle/manifest.json" --output-root="$RUNNER_TEMP/school-ci/build"

      - name: Check synthetic app payload budget
        run: node scripts/check-payload-budget.mjs --dist "$RUNNER_TEMP/school-ci/build/dist-high-school"
